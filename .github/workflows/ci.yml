name: ci

on: [push, pull_request]

jobs:
  crossbuild:
    name: crossbuild
    strategy:
      matrix:
        GOOS: ['freebsd', 'openbsd', 'darwin', 'windows']
        GOARCH: ['amd64']
    runs-on: ${{ vars.ACTIONS_RUNNER }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: 'stable'
      - run: |
          go env
          go build ./cmd/gobgp
          go build ./cmd/gobgpd
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}


      - name: Push metrics
        if: always()
        continue-on-error: true
        uses: perimeter-81/actions/actions/monitoring/push_metrics@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: unit
    runs-on: ${{ vars.ACTIONS_RUNNER }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: 'stable'
      - run: |
          go test -race -timeout 240s ./...
          if [ "$(go env GOARCH)" = "amd64" ]; then go test -race github.com/osrg/gobgp/v3/pkg/packet/bgp -run ^Test_RaceCondition$; else echo 'skip'; fi


      - name: Push metrics
        if: always()
        continue-on-error: true
        uses: perimeter-81/actions/actions/monitoring/push_metrics@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  unit386:
    name: unit386
    runs-on: ${{ vars.ACTIONS_RUNNER }}
    env:
      GOARCH: 386
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: 'stable'
      - run: |
